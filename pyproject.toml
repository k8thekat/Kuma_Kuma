[project]
name = "kuma-kuma"
version = "1.0.0"
authors = [{ name = "k8thekat", email = "Cadwalladerkatelynn@gmail.com" }]
description = "Personal Discord bot for developing and testing Discord.py cogs."
requires-python = ">=3.12"
license = { file = "COPYING" }
dependencies = [
    "aiofiles",
    "aiohttp",
    "asqlite",
    "async-garlandtools",
    "asyncpraw",
    "attrs",
    "colorlog",
    "discord.py",
    "fake-useragent",
    "GitPython",
    "imagehash",
    "import-expression",
    "lxml",
    "Pillow",
    "psutil",
    "python-dateutil",
    "pytz",
    "pyzill",
    "requests-cache",
    "sentry-sdk",
    "thefuzz",
    "typing-extensions",
    "tzlocal",
    # Git/local dependencies — sources defined in [tool.uv.sources]
    "a-sonarr-radarr",
    "async-universalis",
    "cc-ampapi",
    "gap",
    "moogle-intuition",
]

[project.urls]
GitHub = "https://github.com/k8thekat/Kuma_Kuma"

[tool.uv.sources]
a-sonarr-radarr = { git = "https://github.com/k8thekat/a_sonarr_radarr.git" }
async-garlandtools = { git = "https://github.com/k8thekat/GarlandToolsAPI_wrapper.git", branch = "development" }
async-universalis = { git = "https://github.com/k8thekat/UniversalisAPI_wrapper.git" }
cc-ampapi = { git = "https://github.com/k8thekat/AMPAPI_Python.git", branch = "developer" }
gap = { git = "https://github.com/k8thekat/GoogleAPI-python" }
moogle-intuition = { git = "https://github.com/k8thekat/moogles_intuition", branch = "development" }

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "ASYNC240", # Using pathlib instead of Trio/etc inside Async functions.
    "C901", # Function is too complex
    "COM812", # Conflicts with the ruff formatter.
    "D203", # Incompatible with D211 (no-blank-line-before-class).
    "D213", # Incompatible with D212 (multi-line-summary-first-line).
    "D401", # Ignore "Imperative Mood" statement for docstrings.
    "D101", # Public class docstring requirement.
    "D102", # Docstring on public properties.
    "D105", # Magic(dunder) __method__ docstring requirement.
    "D107", # Docstring on `__init__` functions.
    "ERA001", # Ignore commented out code.
    "FBT001", # Boolean argument.
    "FBT002", # Boolean positional argument.
    "FIX002", # Ignore TODO's telling you to "fix them".
    "F401",
    "F402",
    "F403",
    "F405",
    "INP001", # Implicit namespace package, missing __init__.py
    "PERF203",
    "PLR",
    "RUF001",
    "RUF002", # The character U+2013 "–" could be confused with the ASCII character U+002d "-", which is more common in source code.
    "RUF009",
    "RUF052", # for filtering "local dummy variable is accessed" eg. - vars using `_`
    "SIM105",
    "TD002", # No "author" in TODO comments.
    "TD003", # Ignore TODO's not having a link/url to an issue.
    "TD004", # No "colon" in  TODO comments.
    "T201", # Print found...
    "UP007",
    "UP034",
    "UP045", # Type var `Optional[X]` vs `X | None`
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
combine-as-imports = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"

[tool.pyright]
venvPath = "."
venv = ".venv"
# gap (GoogleAPI-python) is an editable git install; pyright's static resolver
# does not follow .pth-based editable installs, so the source root is listed here.
extraPaths = ["/home/kat/gitHub/GoogleAPI-python"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
exclude = ["logs/**", "**/.venv/**", "**/.vscode-server/", "/usr/*", "**/node_modules", "**/__pycache__", "**/.*"]
include = [""]
useLibraryCodeForTypes = true
reportIncompatibleMethodOverride = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
